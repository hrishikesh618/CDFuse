name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the package
        # Importing every module catches missing imports that unit tests can
        # miss, and asserts the rioxarray accessor is actually registered —
        # without it, boundary clipping and GeoTIFF export fail at runtime.
        run: |
          python - <<'PY'
          import xarray as xr

          import cdfuse
          from cdfuse import config, export, io, metrics, pipeline, plotting, preprocess, sample

          assert hasattr(xr.DataArray([1.0]), "rio"), "rioxarray accessor is not registered"
          assert set(metrics.METRIC_FUNCTIONS) >= set(config.DEFAULT_METRICS)
          print(f"cdfuse {cdfuse.__version__} imported; cartopy={plotting.CARTOPY_AVAILABLE}")
          PY

      - name: Check the Streamlit entrypoint parses
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('app.py').read_text(encoding='utf-8'))"
